name: Refresh the UF series

# The datasets the app reads are regenerated every morning and committed. The
# app then serves fresh data from a static file with no API call of its own, so
# a first load is never more than a day behind even with every endpoint down.
on:
  schedule:
    # 12:00 UTC, after the Banco Central has published the day's value.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The source chain's own tests, before spending a run on the network.
      - name: Test the source chain
        run: python3 -m unittest discover -s tools -p "test_*.py"

      # CMF_API_KEY is the CMF's own API, whose terms explicitly authorise
      # republishing its data. It is a repository secret, which is possible
      # here and impossible in the browser — that asymmetry is the whole
      # reason this job pulls from a different source than the app does.
      # Unset, the secret interpolates to an empty string and the generators
      # fall back to mindicador.cl, which is what they did before. Nothing
      # breaks; it just runs on the unauthorised source. See docs/DATA.md.
      - name: Regenerate the series
        env:
          CMF_API_KEY: ${{ secrets.CMF_API_KEY }}
        run: |
          python3 tools/build_uf_daily_seed.py
          python3 tools/build_usd_daily_seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The dataset is only allowed to land if it still passes the checks that
      # guard it: no missing day, no implausible jump, the December 2014 values
      # correct, and the series still reproducing the CPI the INE published.
      - name: Validate the regenerated series
        working-directory: web
        run: npm test

      - name: Commit when something changed
        run: |
          if git diff --quiet -- web/public/; then
            echo "The series are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/
          git commit -m "Refresh the bundled series

          Regenerated by the scheduled workflow and validated against the same
          checks that guard the bundled data."
          git push
