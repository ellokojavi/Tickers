name: Refresh the UF series

# The dataset both platforms read is regenerated every morning and committed.
# The web app then serves fresh data from a static file with no API call of its
# own, and every Android release ships the series up to date. One source of
# truth for both.
on:
  schedule:
    # 12:00 UTC, after the Banco Central has published the day's value.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the series
        run: python3 tools/build_uf_daily_seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The dataset is only allowed to land if it still passes the checks that
      # guard it: no missing day, no implausible jump, the December 2014 values
      # correct, and the series still reproducing the CPI the INE published.
      - name: Validate the regenerated series
        working-directory: web
        run: npm test

      - name: Commit when something changed
        run: |
          if git diff --quiet -- app/src/main/assets/uf_daily.txt; then
            echo "The series is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/uf_daily.txt
          git commit -m "Refresh the UF series

          Regenerated by the scheduled workflow and validated against the same
          checks that guard the bundled data."
          git push
