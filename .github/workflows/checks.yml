name: Checks

# The app's value is entirely in its numbers, so nothing lands without the
# maths suite having run. The golden fixtures in web/golden pin the figures a
# user could quote, and this is what makes them matter: without it they would
# only run when someone remembered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The generators produce every figure the app ships, so the code that reads a
  # source is tested on every commit rather than only when the daily refresh
  # runs it. Stdlib unittest, no dependency, no network.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source chain
        run: python3 -m unittest discover -s tools -p "test_*.py"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Types
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test
