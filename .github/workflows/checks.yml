name: Checks

# Both channels are tested on the same commit. The point is the golden vectors:
# they live in shared/golden and both suites read them, so an engine change on
# one platform that is not mirrored on the other turns this red rather than
# shipping two different answers to the same question.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/testDebugUnitTest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Types
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test
